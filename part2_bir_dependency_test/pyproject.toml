[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcab1-bir-dependency"
version = "0.1.0"
description = "Stage 1: TCAB1-stratified break-induced replication dependency in ALT+ osteosarcoma (DepMap 26Q1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "GEOparse>=2.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "ipykernel>=7.2.0",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.0"]
dev = ["black>=23.0", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=7.4",
]
